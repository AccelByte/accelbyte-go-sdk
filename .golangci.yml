version: "2"

run:
  issues-exit-code: 1
  # include test files or not
  tests: false

output:
  formats:
    text:
      print-issued-lines: true
      print-linter-name: true

# Only the linters that were active under golangci-lint v1.42.1 (enable-all minus the disabled list)
# and still exist in v2. Be careful when adding linters: it might surface a lot of existing issues.
linters:
  default: none
  enable:
    - asciicheck
    - dogsled
    - durationcheck
    - errcheck
    - errname
    - exhaustive
    - goconst
    - godox
    - goheader
    - gomodguard
    - goprintffuncname
    - govet
    - ineffassign
    - makezero
    - misspell
    - nakedret
    - nlreturn
    - nolintlint
    - prealloc
    - predeclared
    - promlinter
    - rowserrcheck
    - sqlclosecheck
    - staticcheck
    - thelper
    - tparallel
    - unconvert
    - unused
    - whitespace
  settings:
    govet:
      enable:
        - shadow
    staticcheck:
      # stylecheck (ST*) was disabled before, TODO: enable for configRepository
      checks:
        - all
        - -ST*
    goheader:
      values:
        regexp:
          YEAR: (2018|2019|2020|2021|2022|2023|2024|2025)(-)?(2019|2020|2021|2022|2023|2024|2025|2026)?
      template: |-
        Copyright (c) {{ YEAR }} AccelByte Inc. All Rights Reserved.
        This is licensed software from AccelByte Inc, for limitations
        and restrictions contact your company contract manager.

formatters:
  enable:
    - gofmt
    - goimports

issues:
  max-same-issues: 20
