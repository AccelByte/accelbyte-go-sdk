version: "2"

run:
  issues-exit-code: 1
  # include test files or not
  tests: false

output:
  formats:
    text:
      print-issued-lines: true
      print-linter-name: true

# Only the linters that were active under golangci-lint v1.42.1 (enable-all minus the disabled list)
# and still exist in v2, minus style-only ones (nlreturn, whitespace, prealloc, predeclared, nolintlint) that flagged hand-written code. Be careful when adding linters: it might surface a lot of existing issues.
linters:
  default: none
  enable:
    - asciicheck
    - dogsled
    - durationcheck
    - errcheck
    - errname
    - exhaustive
    - goconst
    - godox
    - goheader
    - gomodguard
    - goprintffuncname
    - govet
    - ineffassign
    - makezero
    - misspell
    - nakedret
    - promlinter
    - rowserrcheck
    - sqlclosecheck
    - staticcheck
    - thelper
    - tparallel
    - unconvert
    - unused
  exclusions:
    # generated headers here are non-standard ("// Code generated. DO NOT EDIT."), so match loosely
    generated: lax
    presets:
      - comments
      - std-error-handling
      - common-false-positives
      - legacy
    paths:
      - .*-sdk/pkg/.*client(models)?/
      - services-api/pkg/factory/
  settings:
    govet:
      enable:
        - shadow
      disable:
        # gopls modernizer analyzer, new in recent Go versions
        - inline
    staticcheck:
      # stylecheck (ST*) was disabled before, TODO: enable for configRepository
      # QF* quickfixes and SA1019 (deprecated usage) are not enforced yet
      checks:
        - all
        - -ST*
        - -QF*
        - -SA1019
    goconst:
      ignore-string-values:
        - bearer
        - basic
        - https
        - "true"
    goheader:
      values:
        regexp:
          YEAR: (2018|2019|2020|2021|2022|2023|2024|2025)(-)?(2019|2020|2021|2022|2023|2024|2025|2026)?
      template: |-
        Copyright (c) {{ YEAR }} AccelByte Inc. All Rights Reserved.
        This is licensed software from AccelByte Inc, for limitations
        and restrictions contact your company contract manager.

formatters:
  enable:
    - gofmt
    - goimports

issues:
  max-same-issues: 20
